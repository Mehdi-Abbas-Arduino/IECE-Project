<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Parking</title>
<style>
:root {
  --bg: #F3F5F4; --card: #FFFFFF; --ink: #18222B; --muted: #5C6B73; --line: #DCE3E0;
  --accent: #0B6E5F; --accent-ink: #FFFFFF; --accent-soft: #E3F1EE;
  --free: #1E9E4A; --busy: #D23A2E; --held: #C8741A; --field: #F7F9F8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1316; --card: #151C20; --ink: #DCE4E8; --muted: #8E9DA5; --line: #27333A;
    --accent: #4CC7AE; --accent-ink: #062A23; --accent-soft: #15302B;
    --free: #4CD07A; --busy: #F0675B; --held: #EFA24E; --field: #11171A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1316; --card: #151C20; --ink: #DCE4E8; --muted: #8E9DA5; --line: #27333A;
  --accent: #4CC7AE; --accent-ink: #062A23; --accent-soft: #15302B;
  --free: #4CD07A; --busy: #F0675B; --held: #EFA24E; --field: #11171A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--free); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }

/* status */
.status { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.bay { width: 74px; height: 92px; border: 3px dashed var(--line); border-radius: 10px; display: grid; place-items: center; }
.bay svg { width: 44px; height: 44px; }
.state { font-size: 28px; font-weight: 700; line-height: 1.1; }
.state.free { color: var(--free); } .state.busy { color: var(--busy); } .state.held { color: var(--held); }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-top: 8px; }

/* form */
label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
input { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-bottom: 14px; }
.row > *, .card, form { min-width: 0; }
.field { margin-bottom: 14px; }
.plate { text-transform: uppercase; font-family: var(--mono); letter-spacing: 0.08em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.day { flex: 0 0 auto; min-width: 58px; text-align: center; font: inherit; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; }
.day b { display: block; font-size: 18px; }
.day small { font-size: 12px; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] small { color: inherit; }

/* timeline */
.timeline { position: relative; height: 34px; border-radius: 8px; background: var(--field); border: 1px solid var(--line); overflow: hidden; margin-bottom: 4px; }
.blk { position: absolute; top: 0; bottom: 0; background: var(--busy); opacity: 0.75; }
.blk.mine { background: var(--accent); opacity: 1; }
.blk.pick { background: transparent; border: 2px solid var(--accent); border-radius: 4px; }
.now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); margin-bottom: 8px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.summary { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
.summary b { color: var(--ink); }

button.primary, button.secondary, button.danger { font: inherit; font-weight: 600; width: 100%; padding: 13px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
button.danger { background: transparent; color: var(--busy); border-color: var(--line); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.actions { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap: 10px; margin-top: 14px; }

.msg { font-size: 14px; margin: 12px 0 0; min-height: 1em; }
.msg:empty { margin: 0; min-height: 0; }
.msg.err { color: var(--busy); } .msg.ok { color: var(--free); }

/* ticket */
.ticket { border: 2px solid var(--accent); }
.code { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin-top: 10px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

.find { display: flex; gap: 8px; }
.find input { min-width: 0; flex: 1; }
.find input { font-family: var(--mono); letter-spacing: 0.1em; }
.find button { width: auto; padding: 0 16px; }
ul.list { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }
ul.list li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
.muted { color: var(--muted); }
footer { text-align: center; font-size: 12px; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Smart Parking</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="live">Connecting…</span></div>
  </header>

  <section class="card" aria-live="polite">
    <div class="status">
      <div class="bay" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="bayIcon"></svg>
      </div>
      <div>
        <div class="state" id="state">—</div>
        <div class="sub" id="stateSub">Checking the spot…</div>
        <span class="pill" id="gatePill">Gate —</span>
      </div>
    </div>
  </section>

  <section class="card ticket" id="ticket" hidden>
    <h2>Your booking</h2>
    <div class="muted" style="font-size:13px">Booking code</div>
    <div class="code" id="tCode"></div>
    <dl class="kv">
      <dt>Name</dt><dd id="tName"></dd>
      <dt>Plate</dt><dd id="tPlate" class="plate"></dd>
      <dt>When</dt><dd id="tWhen"></dd>
    </dl>
    <div class="actions">
      <button class="primary" id="openBtn">Open gate</button>
      <button class="danger" id="cancelBtn">Cancel</button>
    </div>
    <p class="msg" id="tMsg"></p>
  </section>

  <section class="card" id="bookCard">
    <h2>Book the spot</h2>
    <form id="form" novalidate>
      <div class="row">
        <div><label for="name">Your name</label><input id="name" autocomplete="name" maxlength="24" required></div>
        <div><label for="plate">Number plate</label><input id="plate" class="plate" autocomplete="off" maxlength="10" required></div>
      </div>

      <label>Day</label>
      <div class="days" id="days" role="group" aria-label="Day"></div>

      <div class="timeline" id="timeline" aria-hidden="true"></div>
      <div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      <div class="legend">
        <span><i style="background:var(--busy);opacity:.75"></i>Booked</span>
        <span><i style="background:var(--accent)"></i>Yours</span>
        <span><i style="border:2px solid var(--accent)"></i>Selected</span>
      </div>

      <div class="row">
        <div><label for="start">Arrive at</label><input id="start" type="time" step="300" required></div>
        <div><label>&nbsp;</label><button type="button" class="secondary" id="nowBtn">Now</button></div>
      </div>

      <div class="field">
        <label>How long</label>
        <div class="chips" id="durations" role="group" aria-label="Duration"></div>
      </div>

      <p class="summary" id="summary"></p>
      <button class="primary" type="submit" id="bookBtn">Book spot</button>
      <p class="msg" id="formMsg"></p>
    </form>
  </section>

  <section class="card">
    <h2>Already booked?</h2>
    <div class="find">
      <input id="findCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="Booking code">
      <button class="secondary" id="findBtn">Find</button>
    </div>
    <p class="msg" id="findMsg"></p>
  </section>

  <section class="card">
    <h2>Upcoming bookings</h2>
    <ul class="list" id="upcoming"></ul>
  </section>

  <footer id="rules"></footer>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var DURATIONS = [15, 30, 60, 120, 180, 240];
  var STORE = "parking.booking";
  var ICONS = {
    free: '<path d="M7 20V4h6a4 4 0 0 1 0 8H7"/>',
    car: '<path d="M5 17h14v-4l-2-5H7l-2 5v4z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/><path d="M5 13h14"/>',
    held: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
  };

  var status = null, skew = 0, mine = null, selDay = 0, selMin = 60, okPolls = 0;

  // ---------- helpers ----------
  function nowS() { return Math.floor(Date.now() / 1000) + skew; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hm(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function dayName(t) {
    var d = new Date(t * 1000), today = startOfDay(0);
    var diff = Math.round((startOfDayOf(d) - today) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  function startOfDay(offset) { var d = new Date(nowS() * 1000); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d.getTime(); }
  function startOfDayOf(d) { var c = new Date(d.getTime()); c.setHours(0, 0, 0, 0); return c.getTime(); }
  function fmtDur(m) { return m < 60 ? m + " min" : (m % 60 ? (m / 60).toFixed(1) : m / 60) + " h"; }
  function msg(el, text, kind) { el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }

  function api(path, body) {
    var opts = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    return fetch("/api/" + path, opts).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "Bad response from the parking controller" }; })
        .then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ("Error " + r.status)); return j; });
    });
  }

  function loadMine() { try { mine = JSON.parse(localStorage.getItem(STORE)); } catch (e) { mine = null; } }
  function saveMine(b) { mine = b; try { b ? localStorage.setItem(STORE, JSON.stringify(b)) : localStorage.removeItem(STORE); } catch (e) {} }

  // ---------- selection ----------
  function selStart() {
    var v = $("start").value;
    if (!v) return null;
    var p = v.split(":"), d = new Date(startOfDay(selDay));
    d.setHours(+p[0], +p[1], 0, 0);
    return Math.floor(d.getTime() / 1000);
  }
  function setStartToNow() {
    var d = new Date(nowS() * 1000);
    var m = Math.ceil((d.getHours() * 60 + d.getMinutes()) / 5) * 5;
    if (m >= 1440) m = 1435;
    selDay = 0;
    $("start").value = pad(Math.floor(m / 60)) + ":" + pad(m % 60);
    render();
  }

  // ---------- rendering ----------
  function renderDays() {
    var maxDays = status ? status.rules.max_days_ahead : 7, html = "";
    for (var i = 0; i < maxDays; i++) {
      var d = new Date(startOfDay(i));
      var top = i === 0 ? "Today" : d.toLocaleDateString(undefined, { weekday: "short" });
      html += '<button type="button" class="day" data-day="' + i + '" aria-pressed="' + (i === selDay) + '"><small>' + top + "</small><b>" + d.getDate() + "</b></button>";
    }
    $("days").innerHTML = html;
  }

  function renderDurations() {
    var max = status ? status.rules.max_minutes : 240, min = status ? status.rules.min_minutes : 15;
    $("durations").innerHTML = DURATIONS.filter(function (m) { return m >= min && m <= max; }).map(function (m) {
      return '<button type="button" class="chip" data-min="' + m + '" aria-pressed="' + (m === selMin) + '">' + fmtDur(m) + "</button>";
    }).join("");
  }

  function renderTimeline() {
    var day0 = startOfDay(selDay) / 1000, day1 = day0 + 86400, html = "";
    function pos(t) { return ((Math.max(day0, Math.min(day1, t)) - day0) / 86400 * 100).toFixed(2); }
    (status ? status.bookings : []).forEach(function (b) {
      if (b.end <= day0 || b.start >= day1) return;
      var isMine = mine && mine.id === b.id;
      html += '<div class="blk' + (isMine ? " mine" : "") + '" style="left:' + pos(b.start) + "%;width:" + (pos(b.end) - pos(b.start)) + '%"></div>';
    });
    var s = selStart();
    if (s) html += '<div class="blk pick" style="left:' + pos(s) + "%;width:" + Math.max(0.6, pos(s + selMin * 60) - pos(s)) + '%"></div>';
    var n = nowS();
    if (n >= day0 && n < day1) html += '<div class="now" style="left:' + pos(n) + '%"></div>';
    $("timeline").innerHTML = html;
  }

  function conflict(s, e) {
    return (status ? status.bookings : []).some(function (b) { return s < b.end && b.start < e; });
  }

  function renderSummary() {
    var s = selStart(), el = $("summary"), btn = $("bookBtn");
    if (!s) { el.textContent = "Pick a time."; btn.disabled = true; return; }
    var e = s + selMin * 60, problem = "";
    if (s < nowS() - 300) problem = "That time has already passed.";
    else if (conflict(Math.max(s, nowS()), e)) problem = "That time overlaps another booking.";
    else if (mine) problem = "You already have a booking. Cancel it to book another time.";
    el.innerHTML = problem ? '<span style="color:var(--busy)">' + problem + "</span>"
      : "<b>" + dayName(s) + ", " + hm(Math.max(s, nowS())) + "–" + hm(e) + "</b> · " + fmtDur(selMin);
    btn.disabled = !!problem || !status;
  }

  function renderStatus() {
    if (!status) return;
    var occ = status.spot.occupied, res = status.spot.reserved, el = $("state"), sub = $("stateSub");
    var active = status.bookings.filter(function (b) { return b.active; })[0];
    var next = status.bookings.filter(function (b) { return b.start > status.now; })[0];
    if (occ) { el.textContent = "Occupied"; el.className = "state busy"; $("bayIcon").innerHTML = ICONS.car; }
    else if (res) { el.textContent = "Reserved"; el.className = "state held"; $("bayIcon").innerHTML = ICONS.held; }
    else { el.textContent = "Free"; el.className = "state free"; $("bayIcon").innerHTML = ICONS.free; }
    $("bayIcon").style.color = occ ? "var(--busy)" : res ? "var(--held)" : "var(--free)";
    if (active) sub.textContent = "Booked until " + hm(active.end) + (active.arrived ? "" : " · driver not arrived yet");
    else if (next) sub.textContent = "Next booking " + dayName(next.start).toLowerCase() + " at " + hm(next.start);
    else sub.textContent = "No upcoming bookings";
    $("gatePill").textContent = "Gate " + (status.gate.open ? "open" : "closed");
  }

  function renderTicket() {
    var t = $("ticket");
    if (!mine) { t.hidden = true; return; }
    t.hidden = false;
    $("tCode").textContent = mine.code;
    $("tName").textContent = mine.name;
    $("tPlate").textContent = mine.plate;
    $("tWhen").textContent = dayName(mine.start) + ", " + hm(mine.start) + "–" + hm(mine.end);
    var early = status ? status.rules.early_minutes * 60 : 600, n = nowS();
    var canOpen = n >= mine.start - early && n < mine.end;
    $("openBtn").disabled = !canOpen;
    $("openBtn").title = canOpen ? "" : "Opens " + (early / 60) + " min before your booking starts";
  }

  function renderUpcoming() {
    var items = status ? status.bookings : [];
    $("upcoming").innerHTML = items.length ? items.map(function (b) {
      var isMine = mine && mine.id === b.id;
      return "<li><span>" + dayName(b.start) + ", " + hm(b.start) + "–" + hm(b.end) + "</span><span class=\"muted\">" +
        (isMine ? "Yours" : b.active ? "Now" : "Booked") + "</span></li>";
    }).join("") : '<li class="muted">The spot is free for the next ' + (status ? status.rules.max_days_ahead : 7) + " days.</li>";
  }

  function renderRules() {
    if (!status) return;
    var r = status.rules;
    $("rules").textContent = "Book " + r.min_minutes + " min to " + (r.max_minutes / 60) + " h, up to " + r.max_days_ahead +
      " days ahead. Your code opens the gate from " + r.early_minutes + " min before your start. Bookings not used within " +
      r.no_show_minutes + " min are released.";
  }

  function render() {
    renderDays(); renderDurations(); renderTimeline(); renderSummary(); renderStatus(); renderTicket(); renderUpcoming(); renderRules();
  }

  // ---------- data ----------
  function poll() {
    api("status?t=" + Math.floor(Date.now() / 1000)).then(function (s) {
      status = s;
      skew = s.now - Math.floor(Date.now() / 1000);
      if (mine && !s.bookings.some(function (b) { return b.id === mine.id; })) {
        saveMine(null);
        msg($("formMsg"), "Your previous booking has ended or was released.", "");
      }
      $("dot").className = "dot on";
      $("live").textContent = "Live";
      if (!okPolls++ && !$("start").value) setStartToNow(); else render();
    }).catch(function () {
      $("dot").className = "dot";
      $("live").textContent = "Offline";
    });
  }

  // ---------- events ----------
  $("days").addEventListener("click", function (e) {
    var b = e.target.closest(".day"); if (!b) return;
    selDay = +b.dataset.day;
    if (selDay > 0 && selStart() && selStart() < nowS()) $("start").value = "09:00";
    render();
  });
  $("durations").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    selMin = +b.dataset.min; render();
  });
  $("timeline").addEventListener("click", function (e) {
    var r = this.getBoundingClientRect();
    var m = Math.floor((e.clientX - r.left) / r.width * 1440 / 15) * 15;
    $("start").value = pad(Math.floor(m / 60)) + ":" + pad(m % 60); render();
  });
  $("start").addEventListener("input", render);
  $("nowBtn").addEventListener("click", setStartToNow);
  $("plate").addEventListener("input", function () { this.value = this.value.toUpperCase(); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("name").value.trim(), plate = $("plate").value.trim(), s = selStart();
    if (!name) return msg($("formMsg"), "Enter your name.", "err");
    if (plate.length < 2) return msg($("formMsg"), "Enter your number plate.", "err");
    if (!s) return msg($("formMsg"), "Pick a time.", "err");
    s = Math.max(s, nowS());
    $("bookBtn").disabled = true;
    msg($("formMsg"), "Booking…");
    api("book", { name: name, plate: plate, start: s, end: s + selMin * 60 }).then(function (r) {
      saveMine(r.booking);
      msg($("formMsg"), "Booked! Keep your code: " + r.booking.code, "ok");
      poll();
      $("ticket").scrollIntoView({ behavior: "smooth", block: "start" });
    }).catch(function (err) { msg($("formMsg"), err.message, "err"); render(); });
  });

  $("openBtn").addEventListener("click", function () {
    var btn = this; btn.disabled = true;
    msg($("tMsg"), "Opening…");
    api("open", { code: mine.code }).then(function () {
      msg($("tMsg"), "Gate is opening. Drive in!", "ok"); poll();
    }).catch(function (err) { msg($("tMsg"), err.message, "err"); }).then(function () { setTimeout(renderTicket, 3000); });
  });

  $("cancelBtn").addEventListener("click", function () {
    if (!confirm("Cancel your booking for " + hm(mine.start) + "–" + hm(mine.end) + "?")) return;
    api("cancel", { code: mine.code }).then(function () {
      saveMine(null); msg($("tMsg"), ""); msg($("formMsg"), "Booking cancelled.", "ok"); poll();
    }).catch(function (err) { msg($("tMsg"), err.message, "err"); });
  });

  $("findBtn").addEventListener("click", function () {
    var code = $("findCode").value.trim();
    if (!/^\d{6}$/.test(code)) return msg($("findMsg"), "Codes are 6 digits.", "err");
    api("lookup", { code: code }).then(function (r) {
      saveMine(r.booking); $("findCode").value = ""; msg($("findMsg"), "Found your booking.", "ok"); render();
      $("ticket").scrollIntoView({ behavior: "smooth", block: "start" });
    }).catch(function (err) { msg($("findMsg"), err.message, "err"); });
  });

  loadMine();
  render();
